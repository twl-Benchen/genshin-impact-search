<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORS 測試（暫時）</title>
    <meta name="robots" content="noindex">
    <style>
        body {
            margin: 0;
            padding: 16px;
            font-family: 'Noto Sans TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif;
            color: #3B4255;
            background: #F6F2EA;
            line-height: 1.6;
        }
        main { max-width: 860px; margin: 0 auto; }
        h1 { font-size: 22px; margin: 0 0 8px; }
        p { margin: 6px 0; font-size: 14px; }
        label { display: block; margin-top: 12px; font-weight: 700; font-size: 14px; }
        input[type="text"] {
            box-sizing: border-box;
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #D3BC8E;
            border-radius: 8px;
            font: inherit;
            font-size: 14px;
        }
        button {
            margin: 14px 8px 0 0;
            padding: 9px 20px;
            border: none;
            border-radius: 999px;
            background: #FFE6B2;
            color: #3B4255;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }
        button:disabled { opacity: 0.5; }
        table { width: 100%; margin-top: 16px; border-collapse: collapse; font-size: 13px; background: #fff; }
        th, td { padding: 8px; border: 1px solid #E2D8C5; text-align: left; vertical-align: top; word-break: break-all; }
        th { background: #3A4357; color: #ECE5D8; }
        .ok { color: #2E7D32; font-weight: 700; }
        .ng { color: #B5562F; font-weight: 700; }
        .info { color: #6B7280; }
        #ua { font-size: 12px; opacity: 0.7; }
    </style>
</head>
<body>
<main>
    <h1>𝕏 圖片／影片 CORS 測試</h1>
    <p>這是開發用的暫時頁面：測試瀏覽器能不能直接從 FxTwitter 抓到 𝕏 的圖片與影片，並在 canvas 裡處理（合併、轉 GIF 需要）。</p>
    <p>請在 <b>電腦</b> 和 <b>手機（iPhone Safari、Android Chrome）</b> 各測一次，按「複製結果」貼回給我。</p>

    <label for="photo-url">有圖片的 𝕏 貼文連結</label>
    <input type="text" id="photo-url" placeholder="https://x.com/xxx/status/1234567890">

    <label for="gif-url">有 GIF 或影片的 𝕏 貼文連結（可留空，留空就不測影片）</label>
    <input type="text" id="gif-url" placeholder="https://x.com/xxx/status/1234567890">

    <button type="button" id="run">開始測試</button>
    <button type="button" id="copy" disabled>複製結果</button>

    <table>
        <thead><tr><th>#</th><th>測試項目</th><th>結果</th><th>說明</th></tr></thead>
        <tbody id="results"></tbody>
    </table>
    <p id="ua"></p>
</main>

<script>
    var API = 'https://api.fxtwitter.com/status/';
    var rows = [];
    var tbody = document.getElementById('results');
    document.getElementById('ua').textContent = '頁面來源：' + location.origin + '｜瀏覽器：' + navigator.userAgent;

    function statusId(text) {
        var m = /\/status(?:es)?\/(\d{5,25})/.exec(text || '');
        return m ? m[1] : null;
    }

    function addRow(name, ok, detail) {
        rows.push({ name: name, ok: ok, detail: detail });
        var tr = document.createElement('tr');
        var cells = [rows.length, name, ok === true ? '✅ 成功' : ok === false ? '❌ 失敗' : 'ℹ️', detail];
        cells.forEach(function (text, i) {
            var td = document.createElement('td');
            td.textContent = text;
            if (i === 2) td.className = ok === true ? 'ok' : ok === false ? 'ng' : 'info';
            tr.appendChild(td);
        });
        tbody.appendChild(tr);
    }

    function errText(e) {
        return (e && (e.name + ': ' + e.message)) || String(e);
    }

    function withTimeout(promise, ms) {
        return Promise.race([promise, new Promise(function (_, reject) {
            setTimeout(function () { reject(new Error('逾時 ' + ms / 1000 + ' 秒')); }, ms);
        })]);
    }

    // 畫進 canvas 後能不能匯出（被 tainted 的 canvas 會丟 SecurityError）
    function canvasExport(source, w, h) {
        var c = document.createElement('canvas');
        c.width = Math.max(1, Math.min(w, 400));
        c.height = Math.max(1, Math.min(h, 400));
        var ctx = c.getContext('2d');
        ctx.drawImage(source, 0, 0, c.width, c.height);
        ctx.getImageData(0, 0, 1, 1);
        return new Promise(function (resolve, reject) {
            c.toBlob(function (b) { b ? resolve(b) : reject(new Error('toBlob 回傳 null')); }, 'image/png');
        });
    }

    function loadImg(src, cors) {
        return new Promise(function (resolve, reject) {
            var img = new Image();
            if (cors) img.crossOrigin = 'anonymous';
            img.onload = function () { resolve(img); };
            img.onerror = function () { reject(new Error('圖片載入失敗（可能是 CORS 被擋）')); };
            img.src = src;
        });
    }

    function loadVideo(src, cors) {
        return new Promise(function (resolve, reject) {
            var v = document.createElement('video');
            if (cors) v.crossOrigin = 'anonymous';
            v.muted = true;
            v.playsInline = true;
            v.preload = 'auto';
            v.onloadeddata = function () { resolve(v); };
            v.onerror = function () { reject(new Error('影片載入失敗（可能是 CORS 被擋或格式不支援）')); };
            v.src = src;
            v.load();
        });
    }

    async function testApi(id, label) {
        try {
            var res = await withTimeout(fetch(API + id), 15000);
            var data = await res.json();
            addRow('FxTwitter API（' + label + '）', true,
                'HTTP ' + res.status + '，code=' + data.code + '，message=' + data.message +
                '，access-control-allow-origin=' + (res.headers.get('access-control-allow-origin') || '（瀏覽器不公開此標頭，讀不到是正常的）'));
            return data;
        } catch (e) {
            addRow('FxTwitter API（' + label + '）', false, errText(e));
            return null;
        }
    }

    async function testPhoto(url) {
        // A. fetch → blob → canvas
        try {
            var res = await withTimeout(fetch(url), 20000);
            if (!res.ok) throw new Error('HTTP ' + res.status);
            var blob = await res.blob();
            var objUrl = URL.createObjectURL(blob);
            var img = await loadImg(objUrl, false);
            var out = await canvasExport(img, img.naturalWidth, img.naturalHeight);
            URL.revokeObjectURL(objUrl);
            addRow('圖片：fetch → blob → canvas 匯出', true,
                img.naturalWidth + '×' + img.naturalHeight + '，' + Math.round(blob.size / 1024) + ' KB，' + blob.type + '，匯出 ' + out.size + ' bytes');
        } catch (e) {
            addRow('圖片：fetch → blob → canvas 匯出', false, errText(e));
        }
        // B. <img crossorigin="anonymous"> → canvas
        try {
            var img2 = await withTimeout(loadImg(url + (url.indexOf('?') < 0 ? '?' : '&') + 'cb=1', true), 20000);
            await canvasExport(img2, img2.naturalWidth, img2.naturalHeight);
            addRow('圖片：<img crossorigin> → canvas 匯出', true, img2.naturalWidth + '×' + img2.naturalHeight);
        } catch (e) {
            addRow('圖片：<img crossorigin> → canvas 匯出', false, errText(e));
        }
        // C. 參考：不加 crossorigin 應該會被 tainted
        try {
            var img3 = await withTimeout(loadImg(url + (url.indexOf('?') < 0 ? '?' : '&') + 'cb=2', false), 20000);
            await canvasExport(img3, img3.naturalWidth, img3.naturalHeight);
            addRow('參考：<img> 不加 crossorigin → canvas', null, '沒有被 tainted（少見）');
        } catch (e) {
            addRow('參考：<img> 不加 crossorigin → canvas', null, '預期會失敗：' + errText(e));
        }
    }

    async function testVideo(url) {
        // A. fetch → blob → <video> → canvas（下載 MP4、轉 GIF 用）
        try {
            var res = await withTimeout(fetch(url), 30000);
            if (!res.ok) throw new Error('HTTP ' + res.status);
            var blob = await res.blob();
            var objUrl = URL.createObjectURL(blob);
            var v = await withTimeout(loadVideo(objUrl, false), 20000);
            await canvasExport(v, v.videoWidth, v.videoHeight);
            URL.revokeObjectURL(objUrl);
            addRow('影片：fetch → blob → canvas 匯出', true,
                v.videoWidth + '×' + v.videoHeight + '，' + v.duration.toFixed(1) + ' 秒，' + Math.round(blob.size / 1024) + ' KB');
        } catch (e) {
            addRow('影片：fetch → blob → canvas 匯出', false, errText(e));
        }
        // B. <video crossorigin> 直接載入 → seek → canvas
        try {
            var v2 = await withTimeout(loadVideo(url, true), 20000);
            await new Promise(function (resolve) {
                v2.onseeked = resolve;
                v2.currentTime = Math.min(0.5, (v2.duration || 1) / 2);
            });
            await canvasExport(v2, v2.videoWidth, v2.videoHeight);
            addRow('影片：<video crossorigin> → seek → canvas 匯出', true, v2.videoWidth + '×' + v2.videoHeight);
        } catch (e) {
            addRow('影片：<video crossorigin> → seek → canvas 匯出', false, errText(e));
        }
    }

    async function run() {
        var btn = document.getElementById('run');
        btn.disabled = true;
        rows = [];
        tbody.textContent = '';

        // 1. API：用一篇固定存在的純文字貼文（Twitter 第一篇貼文）
        var base = await testApi('20', '固定貼文 20');

        // 2. 圖片：使用者提供的貼文；沒有的話用固定貼文作者的頭像（也在 pbs.twimg.com）
        var photoId = statusId(document.getElementById('photo-url').value);
        var photoUrl = null;
        if (photoId) {
            var data = await testApi(photoId, '圖片貼文');
            var photos = data && data.tweet && data.tweet.media && data.tweet.media.photos;
            if (photos && photos.length) {
                photoUrl = photos[0].url.split('?')[0] + '?name=orig';
                addRow('圖片貼文內容', null, photos.length + ' 張，第 1 張：' + photoUrl);
            } else {
                addRow('圖片貼文內容', false, '這篇貼文沒有圖片');
            }
        }
        if (!photoUrl && base && base.tweet && base.tweet.author && base.tweet.author.avatar_url) {
            photoUrl = base.tweet.author.avatar_url;
            addRow('改用頭像測試', null, photoUrl);
        }
        if (photoUrl) await testPhoto(photoUrl);

        // 3. 影片
        var gifId = statusId(document.getElementById('gif-url').value);
        if (gifId) {
            var gdata = await testApi(gifId, 'GIF／影片貼文');
            var videos = gdata && gdata.tweet && gdata.tweet.media && gdata.tweet.media.videos;
            if (videos && videos.length) {
                addRow('影片貼文內容', null, 'type=' + videos[0].type + '，' + videos[0].url);
                await testVideo(videos[0].url);
            } else {
                addRow('影片貼文內容', false, '這篇貼文沒有 GIF／影片');
            }
        } else {
            addRow('影片', null, '未提供連結，略過');
        }

        btn.disabled = false;
        document.getElementById('copy').disabled = false;
    }

    document.getElementById('run').addEventListener('click', run);
    document.getElementById('copy').addEventListener('click', function () {
        var text = rows.map(function (r, i) {
            return (i + 1) + '. ' + (r.ok === true ? '✅' : r.ok === false ? '❌' : 'ℹ️') + ' ' + r.name + '：' + r.detail;
        }).join('\n') + '\n' + document.getElementById('ua').textContent;
        var done = function () { document.getElementById('copy').textContent = '已複製！'; };
        if (navigator.clipboard) {
            navigator.clipboard.writeText(text).then(done, function () { prompt('請手動複製：', text); });
        } else {
            prompt('請手動複製：', text);
        }
    });
</script>
</body>
</html>
