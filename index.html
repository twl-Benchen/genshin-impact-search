<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>原神角色 𝕏 圖片搜尋</title>
    <meta name="description" content="點選原神角色，一鍵產生 𝕏（Twitter）hashtag 搜尋網址，快速找到角色圖片與同人圖。">
    <meta name="theme-color" content="#3B4255">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">

    <!-- 分享連結時的預覽（Discord、LINE、𝕏 等） -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="原神角色 𝕏 圖片搜尋">
    <meta property="og:description" content="點選原神角色，一鍵產生 𝕏 hashtag 搜尋網址，快速找到角色圖片。">
    <meta property="og:url" content="https://twl-benchen.github.io/genshin-impact-search/">
    <meta property="og:locale" content="zh_TW">
    <meta name="twitter:card" content="summary">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap">

    <style>
        /* ===== 原神介面配色 ===== */
        :root {
            --cream: #ECE5D8;
            --cream-light: #F6F2EA;
            --navy: #3B4255;
            --navy-dark: #2B3142;
            --gold: #D3BC8E;
            --gold-light: #FFE6B2;

            --pyro: #FF6640;
            --hydro: #00B4F0;
            --anemo: #35D7A1;
            --electro: #B57BFF;
            --dendro: #8FD43D;
            --cryo: #6FDCE8;
            --geo: #F0AA1E;
            --other: #E8C760;

            --bar-h: 0px; /* 底部操作列高度，由 JS 更新 */
        }

        /* 背景色調可以平滑轉換 */
        @property --tint {
            syntax: '<color>';
            inherits: true;
            initial-value: rgba(211, 188, 142, 0.22);
        }

        body {
            --tint: rgba(211, 188, 142, 0.22);
            margin: 0;
            padding: 10px 10px calc(var(--bar-h) + 20px);
            font-family: 'Noto Sans TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif;
            color: var(--navy);
            background-color: var(--cream-light);
            -webkit-tap-highlight-color: transparent; /* 去除手機點擊時的藍色區塊 */
            transition: --tint 0.6s ease, padding-bottom 0.3s ease;
        }

            /* 選元素篩選時，背景會帶一點該元素的顏色 */
            body[data-element="Pyro"] { --tint: rgba(255, 102, 64, 0.20); }
            body[data-element="Hydro"] { --tint: rgba(0, 180, 240, 0.18); }
            body[data-element="Anemo"] { --tint: rgba(53, 215, 161, 0.20); }
            body[data-element="Electro"] { --tint: rgba(181, 123, 255, 0.18); }
            body[data-element="Dendro"] { --tint: rgba(143, 212, 61, 0.20); }
            body[data-element="Cryo"] { --tint: rgba(111, 220, 232, 0.22); }
            body[data-element="Geo"] { --tint: rgba(240, 170, 30, 0.20); }
            body[data-element="Other"] { --tint: rgba(232, 199, 96, 0.22); }

            body::before {
                content: '';
                position: fixed;
                inset: 0;
                z-index: -1;
                pointer-events: none;
                background:
                    radial-gradient(ellipse 90% 60% at 50% 0%, var(--tint), transparent 70%),
                    radial-gradient(ellipse 70% 50% at 100% 100%, var(--tint), transparent 70%),
                    linear-gradient(180deg, #FBF8F2 0%, var(--cream-light) 50%, #EFE9DD 100%);
            }

        /* ===== 標題 ===== */
        h1 {
            margin: 14px 0 6px;
            font-family: 'Noto Serif TC', serif;
            font-size: 1.6em;
            text-align: center;
            letter-spacing: 0.06em;
        }

            h1 small {
                display: inline-block;
                font-family: 'Noto Sans TC', sans-serif;
                font-size: 14px;
                font-weight: 400;
                letter-spacing: 0;
                opacity: 0.7;
            }

        .title-ornament {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 18px;
            color: var(--gold);
            font-size: 12px;
        }

            .title-ornament::before,
            .title-ornament::after {
                content: '';
                width: min(160px, 25vw);
                height: 1px;
                background: linear-gradient(90deg, transparent, var(--gold));
            }

            .title-ornament::after {
                transform: scaleX(-1);
            }

        /* 鍵盤操作時的焦點框（滑鼠點擊不會出現） */
        button:focus-visible,
        a:focus-visible {
            outline: 3px solid var(--gold);
            outline-offset: 2px;
        }

        /* ===== 元素篩選列 ===== */
        .element-filter {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 22px;
        }

        .element-icon {
            width: 40px;
            height: 40px;
            padding: 0;
            border-radius: 50%;
            border: 2px solid rgba(59, 66, 85, 0.25);
            background: rgba(255, 255, 255, 0.6);
            overflow: hidden;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
        }

            .element-icon img {
                width: 28px;
                height: 28px;
            }

            .element-icon:hover {
                transform: scale(1.08);
                border-color: var(--gold);
            }

            .element-icon[aria-pressed="true"] {
                transform: scale(1.1);
                border-color: var(--gold);
                background: #fff;
                box-shadow: 0 0 0 2px var(--gold-light), 0 2px 10px rgba(211, 188, 142, 0.8);
            }

        /* ===== 角色列表 ===== */
        .character-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-start;
            gap: 10px;
            max-width: 1240px;
            margin: 0 auto;
        }

        .character {
            --el: var(--other);
            flex: 0 0 calc(10% - 10px); /* 桌面：每行 10 個角色 */
            max-width: calc(10% - 10px);
            padding: 0;
            border: none;
            background: none;
            font: inherit;
            color: inherit;
            text-align: center;
            cursor: pointer;
            user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; /* 名稱換行時圖片仍對齊頂端 */
        }

            .character[hidden] {
                display: none;
            }

            .character.Pyro { --el: var(--pyro); }
            .character.Hydro { --el: var(--hydro); }
            .character.Anemo { --el: var(--anemo); }
            .character.Electro { --el: var(--electro); }
            .character.Dendro { --el: var(--dendro); }
            .character.Cryo { --el: var(--cryo); }
            .character.Geo { --el: var(--geo); }
            .character.Other { --el: var(--other); }

        /* 頭像框：淡淡的星級底色（五星金、四星紫） */
        .avatar {
            position: relative;
            width: 100px;
            height: 100px;
            margin-bottom: 8px;
            border-radius: 12px;
            overflow: hidden;
            transition: box-shadow 0.25s ease, transform 0.25s ease, opacity 0.25s ease, filter 0.25s ease;
        }

            .rarity-5 .avatar,
            .avatar.rarity-5 {
                background: linear-gradient(160deg, rgba(236, 178, 96, 0.30), rgba(196, 128, 64, 0.14));
            }

            .rarity-4 .avatar,
            .avatar.rarity-4 {
                background: linear-gradient(160deg, rgba(168, 128, 212, 0.28), rgba(108, 96, 160, 0.12));
            }

            .avatar img,
            .avatar .placeholder {
                width: 100%;
                height: 100%;
                display: block;
                object-fit: cover;
                border-radius: inherit; /* 圖片本身也裁圓角，避免蓋住外框光暈 */
            }

            /* 圖片載入失敗時的替代方塊 */
            .avatar .placeholder {
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 28px;
                opacity: 0.6;
            }

        .character .name {
            font-size: 15px;
            line-height: 1.3;
            transition: opacity 0.25s ease;
        }

        .character:hover .avatar {
            transform: translateY(-2px);
        }

        /* 被選取：元素色的細光暈（範圍小，不會影響隔壁角色） */
        .character[aria-pressed="true"] .avatar {
            box-shadow: 0 0 0 2px color-mix(in srgb, var(--el) 75%, transparent), 0 0 6px 1px var(--el);
        }

        .character[aria-pressed="true"] .name {
            font-weight: 700;
        }

        /* 有角色被選取時，其他角色稍微變淡 */
        .has-selection .character[aria-pressed="false"] .avatar {
            opacity: 0.6;
            filter: saturate(0.75);
        }

        .has-selection .character[aria-pressed="false"] .name {
            opacity: 0.65;
        }

        .has-selection .character[aria-pressed="false"]:hover .avatar,
        .has-selection .character[aria-pressed="false"]:focus-visible .avatar {
            opacity: 0.85;
            filter: none;
        }

        /* ===== 原神風格按鈕 ===== */
        .gbtn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 5px 22px 5px 5px;
            border: 2px solid transparent;
            border-radius: 999px;
            background: var(--cream);
            color: var(--navy);
            font: inherit;
            font-size: 15px;
            font-weight: 500;
            text-decoration: none;
            white-space: nowrap;
            cursor: pointer;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease, transform 0.1s ease;
        }

            .gbtn:hover {
                border-color: #fff;
                box-shadow: 0 0 0 2px var(--gold-light), 0 0 12px rgba(255, 230, 178, 0.6);
            }

            .gbtn:active {
                transform: scale(0.97);
                background: #D9D0BE;
            }

            .gbtn[hidden] {
                display: none;
            }

            /* 按鈕左邊的圓形圖示 */
            .gbtn .icon {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 26px;
                height: 26px;
                border-radius: 50%;
                background: var(--navy);
                color: var(--cream);
                font-size: 13px;
                font-weight: 700;
                line-height: 1;
            }

            .gbtn.primary {
                background: var(--gold-light);
            }

                .gbtn.primary .icon {
                    background: var(--navy-dark);
                    color: var(--gold-light);
                }

                .gbtn.primary:active {
                    background: #EED3A0;
                }

        /* ===== 底部固定操作列 ===== */
        .action-bar {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 900;
            background: rgba(43, 49, 66, 0.94);
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
            color: var(--cream);
            border-top: 1px solid rgba(211, 188, 142, 0.6);
            box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.15);
            transform: translateY(0);
            transition: transform 0.3s ease;
        }

            .action-bar[aria-hidden="true"] {
                transform: translateY(110%);
            }

        .action-bar-inner {
            display: flex;
            align-items: center;
            gap: 16px;
            max-width: 1240px;
            margin: 0 auto;
            padding: 10px 16px;
        }

        .selection-info {
            flex: 1;
            min-width: 0;
        }

        .selected-chips {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding: 3px 3px 5px;
            scrollbar-width: thin;
        }

        /* 已選角色：頭像在上、tag 在下，兩者置中對齊 */
        .chip {
            --el: var(--other);
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            min-width: 44px;
            padding: 0;
            border: none;
            background: none;
            font: inherit;
            cursor: pointer;
        }

            .chip-face {
                position: relative;
                width: 40px;
                height: 40px;
                border: 2px solid var(--el);
                border-radius: 50%;
                overflow: hidden;
                background: var(--cream-light);
            }

            .chip .avatar {
                width: 100%;
                height: 100%;
                margin: 0;
                border-radius: 0;
            }

            /* 滑過顯示 × 表示可移除 */
            .chip-face::after {
                content: '×';
                position: absolute;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                background: rgba(43, 49, 66, 0.6);
                color: #fff;
                font-size: 22px;
                opacity: 0;
                transition: opacity 0.2s ease;
            }

            .chip:hover .chip-face::after,
            .chip:focus-visible .chip-face::after {
                opacity: 1;
            }

            .chip-label {
                font-size: 12px;
                line-height: 1.2;
                color: var(--gold);
                white-space: nowrap;
            }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        /* ===== LINE 社群 ===== */
        #line-community-icon {
            position: fixed;
            bottom: calc(var(--bar-h) + 15px);
            left: 5px;
            z-index: 1000;
            transition: bottom 0.3s ease;
        }

            #line-community-icon img {
                display: block;
                width: 40px;
                height: 40px;
                border-radius: 15px;
                border: 3px solid #ffffff;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            }

        /* ===== 手機 ===== */
        @media screen and (max-width: 1000px) {
            .character {
                flex: 0 0 calc(20% - 10px); /* 每行 5 個角色 */
                max-width: calc(20% - 10px);
            }

            .avatar {
                width: 60px;
                height: 60px;
                border-radius: 10px;
            }

                .avatar .placeholder {
                    font-size: 20px;
                }

            .character .name {
                font-size: 13px;
            }

            .element-filter {
                gap: 6px;
            }
        }

        @media screen and (max-width: 640px) {
            .action-bar-inner {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
                padding: 8px 12px 10px;
            }

            .actions {
                justify-content: center;
            }

            .gbtn {
                font-size: 14px;
                padding-right: 16px;
                gap: 8px;
            }

            /* 手機上按鈕只留短標籤，三顆排成一行 */
            .long-label {
                display: none;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                transition: none !important;
            }
        }
    </style>
</head>
<body>
    <h1>
        選擇要尋找的角色
        <small>(需要登入𝕏帳號)</small>
    </h1>
    <div class="title-ornament" aria-hidden="true">✦</div>

    <div class="element-filter" id="element-filter" role="group" aria-label="依元素篩選"></div>

    <div class="character-list" id="character-list" role="group" aria-label="角色"></div>

    <div class="action-bar" id="action-bar" aria-hidden="true">
        <div class="action-bar-inner">
            <div class="selection-info">
                <div class="selected-chips" id="selected-chips" role="group" aria-label="已選角色（點擊移除）" aria-live="polite"></div>
            </div>
            <div class="actions">
                <a class="gbtn primary" id="view-results-btn" href="#" target="_blank" rel="noopener"><span class="icon" aria-hidden="true">𝕏</span><span>前往𝕏<span class="long-label">頁面</span></span></a>
                <button type="button" class="gbtn" id="copy-url-btn"><span class="icon" aria-hidden="true">⧉</span><span class="label">複製<span class="long-label">網址</span></span></button>
                <button type="button" class="gbtn" id="clear-selection-btn"><span class="icon" aria-hidden="true">✕</span><span>清空<span class="long-label">選取</span></span></button>
            </div>
        </div>
    </div>

    <div id="line-community-icon">
        <a href="https://line.me/ti/g2/ws_23JibNNAGaEja-adxJv8q8f-oHEX7Jxl77w?utm_source=invitation&utm_medium=link_copy&utm_campaign=default" target="_blank" rel="noopener">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRdBmNgZmnl4lPSOnIgbzy4uJXnL_Okl_WDSAtHvbb1d3t58ZZbICa9IMWBuB8as4jIkM4&usqp=CAU"
                 alt="加入 LINE 社群">
        </a>
    </div>

    <script src="characters.js"></script>
    <!-- 本地圖片清單，由 scripts/download-icons.mjs 產生 -->
    <script src="img/manifest.js"></script>
    <script>
        var STORAGE_KEY = 'genshin-search-state';
        var LOCAL_ICONS = window.LOCAL_ICONS || {};
        var charactersById = {};
        CHARACTERS.forEach(function (c) { charactersById[c.id] = c; });

        var selectedRoles = [];
        var activeElement = null;
        var currentUrl = '';

        // 優先用本地圖片，失敗時改用原網址，再失敗就顯示名稱首字
        function createIcon(localKey, remoteUrl, alt, fallbackText) {
            var img = document.createElement('img');
            var sources = [LOCAL_ICONS[localKey], remoteUrl].filter(Boolean);
            img.alt = alt;
            img.loading = 'lazy';
            img.decoding = 'async';
            img.onerror = function () {
                sources.shift();
                if (sources.length > 0) {
                    img.src = sources[0];
                } else if (fallbackText) {
                    var box = document.createElement('span');
                    box.className = 'placeholder';
                    box.setAttribute('aria-hidden', 'true');
                    box.textContent = fallbackText;
                    img.replaceWith(box);
                }
            };
            if (sources.length > 0) img.src = sources[0];
            else setTimeout(img.onerror);
            return img;
        }

        // 帶星級底色的頭像框
        function createAvatar(c) {
            var box = document.createElement('span');
            box.className = 'avatar rarity-' + (c.rarity || 5);
            box.appendChild(createIcon(c.id, c.img, '', c.name.charAt(0)));
            return box;
        }

        function renderElements() {
            var container = document.getElementById('element-filter');
            ELEMENTS.forEach(function (el) {
                var btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'element-icon';
                btn.dataset.element = el.id;
                btn.title = el.name;
                btn.setAttribute('aria-label', el.name);
                btn.setAttribute('aria-pressed', 'false');
                btn.appendChild(createIcon('element:' + el.id, el.img, ''));
                btn.addEventListener('click', function () { filterByTag(el.id); });
                container.appendChild(btn);
            });
        }

        function renderCharacters() {
            var container = document.getElementById('character-list');
            CHARACTERS.forEach(function (c) {
                var btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'character ' + c.element;
                btn.dataset.id = c.id;
                btn.setAttribute('aria-pressed', 'false');
                btn.appendChild(createAvatar(c));
                var label = document.createElement('span');
                label.className = 'name';
                label.textContent = c.name;
                btn.appendChild(label);
                btn.addEventListener('click', function () { toggleSelection(c.id); });
                container.appendChild(btn);
            });
        }

        // 底部操作列裡的已選角色小頭像，點一下移除
        function renderChips() {
            var container = document.getElementById('selected-chips');
            container.textContent = '';
            selectedRoles.forEach(function (id) {
                var c = charactersById[id];
                var chip = document.createElement('button');
                chip.type = 'button';
                chip.className = 'chip character-chip ' + c.element;
                chip.style.setProperty('--el', 'var(--' + c.element.toLowerCase() + ')');
                chip.title = '移除 ' + c.name;
                chip.setAttribute('aria-label', '移除 ' + c.name);
                var face = document.createElement('span');
                face.className = 'chip-face';
                face.appendChild(createAvatar(c));
                chip.appendChild(face);
                var label = document.createElement('span');
                label.className = 'chip-label';
                label.textContent = displayTag(c);
                chip.appendChild(label);
                chip.addEventListener('click', function () { toggleSelection(id); });
                container.appendChild(chip);
            });
        }

        function toggleSelection(id) {
            if (selectedRoles.indexOf(id) >= 0) {
                selectedRoles = selectedRoles.filter(function (item) { return item !== id; });
            } else {
                selectedRoles.push(id);
            }
            update();
        }

        // 點元素只顯示該元素的角色，再點一次同一個元素則顯示全部
        function filterByTag(element) {
            activeElement = activeElement === element ? null : element;
            update();
        }

        function clearSelection() {
            selectedRoles = [];
            update();
        }

        // 每個角色的多個 hashtag 用 OR 組成一組，不同角色之間維持原本的「同時包含」
        function buildQuery(ids) {
            return ids.map(function (id) {
                var tags = charactersById[id].tags.map(function (t) { return '#' + t; });
                return tags.length > 1 ? '(' + tags.join(' OR ') + ')' : tags[0];
            }).join(' ');
        }

        // 底部顯示用：只列出繁體中文 tag（例如 #林尼），實際搜尋仍用全部 tag。
        // 找不到繁中 tag 的角色（如琴、砂糖這類太常見而沒放中文的）就顯示英文 tag。
        function displayTag(c) {
            var zh = c.tags.filter(function (t) {
                return t.indexOf(c.name) >= 0 || c.name.indexOf(t) >= 0;
            });
            return '#' + (zh[0] || c.tags[0]);
        }

        function update() {
            var hasSelection = selectedRoles.length > 0;

            document.querySelectorAll('.character').forEach(function (btn) {
                var id = btn.dataset.id;
                btn.setAttribute('aria-pressed', String(selectedRoles.indexOf(id) >= 0));
                btn.hidden = activeElement !== null && charactersById[id].element !== activeElement;
            });
            document.getElementById('character-list').classList.toggle('has-selection', hasSelection);
            document.querySelectorAll('.element-icon').forEach(function (btn) {
                btn.setAttribute('aria-pressed', String(btn.dataset.element === activeElement));
            });
            if (activeElement) document.body.dataset.element = activeElement;
            else delete document.body.dataset.element;

            var query = hasSelection ? buildQuery(selectedRoles) : '';
            currentUrl = hasSelection ? 'https://x.com/search?q=' + encodeURIComponent(query) : '';
            document.getElementById('view-results-btn').href = currentUrl || '#';
            renderChips();

            var bar = document.getElementById('action-bar');
            bar.setAttribute('aria-hidden', String(!hasSelection));
            bar.inert = !hasSelection;
            updateBarHeight();

            saveState();
        }

        // 讓頁面底部留出操作列的空間，LINE 圖示也跟著往上移
        function updateBarHeight() {
            var bar = document.getElementById('action-bar');
            var h = bar.getAttribute('aria-hidden') === 'true' ? 0 : bar.offsetHeight;
            document.documentElement.style.setProperty('--bar-h', h + 'px');
        }

        // ===== 選取狀態：存在網址 (#c=Klee,Nahida&e=Pyro) 與 localStorage =====
        function saveState() {
            // id 都是英數字，不需編碼，逗號保留原樣比較好讀
            var parts = [];
            if (selectedRoles.length > 0) parts.push('c=' + selectedRoles.join(','));
            if (activeElement) parts.push('e=' + activeElement);
            var hash = parts.join('&');
            history.replaceState(null, '', hash ? '#' + hash : location.pathname + location.search);
            try {
                localStorage.setItem(STORAGE_KEY, hash);
            } catch (e) { /* 無痕模式等情況下 localStorage 可能不能用 */ }
        }

        function loadState() {
            var hash = location.hash.slice(1);
            if (!hash) {
                try {
                    hash = localStorage.getItem(STORAGE_KEY) || '';
                } catch (e) { /* 同上 */ }
            }
            var params = new URLSearchParams(hash);
            selectedRoles = (params.get('c') || '').split(',').filter(function (id, i, arr) {
                return charactersById[id] && arr.indexOf(id) === i;
            });
            var element = params.get('e');
            activeElement = ELEMENTS.some(function (el) { return el.id === element; }) ? element : null;
        }

        function copyToClipboard() {
            var label = document.querySelector('#copy-url-btn .label');
            navigator.clipboard.writeText(currentUrl).then(function () {
                label.textContent = '已複製！';
                clearTimeout(copyTimer);
                copyTimer = setTimeout(function () { label.innerHTML = COPY_LABEL_HTML; }, 2000);
            });
        }

        var COPY_LABEL_HTML = document.querySelector('#copy-url-btn .label').innerHTML;
        var copyTimer;
        renderElements();
        renderCharacters();
        document.getElementById('copy-url-btn').addEventListener('click', copyToClipboard);
        document.getElementById('clear-selection-btn').addEventListener('click', clearSelection);
        window.addEventListener('hashchange', function () {
            loadState();
            update();
        });
        if (window.ResizeObserver) new ResizeObserver(updateBarHeight).observe(document.getElementById('action-bar'));
        loadState();
        update();
    </script>
</body>
</html>
