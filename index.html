<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>原神角色 𝕏 圖片搜尋</title>
    <meta name="description" content="點選原神角色，一鍵產生 𝕏（Twitter）hashtag 搜尋網址，快速找到角色圖片與同人圖。">
    <meta name="theme-color" content="#4CAF50">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">

    <!-- 分享連結時的預覽（Discord、LINE、𝕏 等） -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="原神角色 𝕏 圖片搜尋">
    <meta property="og:description" content="點選原神角色，一鍵產生 𝕏 hashtag 搜尋網址，快速找到角色圖片。">
    <meta property="og:url" content="https://twl-benchen.github.io/genshin-impact-search/">
    <meta property="og:locale" content="zh_TW">
    <meta name="twitter:card" content="summary">

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 10px;
            -webkit-tap-highlight-color: transparent; /* 去除手機點擊時的藍色區塊 */
        }

        h1 {
            font-size: 1.5em;
            text-align: center;
        }

            h1 small {
                font-size: 16px;
                font-weight: normal;
            }

        /* 鍵盤操作時的焦點框（滑鼠點擊不會出現） */
        button:focus-visible,
        a:focus-visible {
            outline: 3px solid #007BFF;
            outline-offset: 2px;
        }

        /* ===== 元素篩選列 ===== */
        .element-filter {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .element-icon {
            width: 39px;
            height: 39px;
            padding: 0;
            border-radius: 50%;
            border: 2px solid rgb(153, 153, 153);
            background: none;
            overflow: hidden;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

            .element-icon img {
                width: 28px;
                height: 28px;
            }

            .element-icon:hover,
            .element-icon[aria-pressed="true"] {
                transform: scale(1.1);
                box-shadow: 0 0 10px 4px rgb(191, 191, 191);
            }

        /* ===== 角色列表 ===== */
        .character-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-start;
            gap: 10px;
        }

        .character {
            flex: 0 0 calc(10% - 10px); /* 桌面：每行 10 個角色 */
            max-width: calc(10% - 10px);
            padding: 0;
            border: none;
            background: none;
            font: inherit;
            color: inherit;
            text-align: center;
            cursor: pointer;
            user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; /* 名稱換行時圖片仍對齊頂端 */
        }

            .character[hidden] {
                display: none;
            }

            .character img,
            .character .placeholder {
                width: 100px;
                height: 100px;
                display: block;
                margin: 0 auto 10px;
                border: 4px solid transparent;
                border-radius: 10px;
                box-sizing: content-box;
                transition: border 0.3s ease, transform 0.3s ease;
            }

            /* 圖片載入失敗時的替代方塊 */
            .character .placeholder {
                display: flex;
                align-items: center;
                justify-content: center;
                background: #eee;
                color: #666;
                font-size: 28px;
            }

            .character[aria-pressed="true"] img,
            .character[aria-pressed="true"] .placeholder {
                transform: scale(1.05);
                border-color: var(--element-color);
            }

            .character.Pyro { --element-color: rgba(255, 102, 64, 0.5); }
            .character.Hydro { --element-color: rgba(0, 192, 255, 0.5); }
            .character.Anemo { --element-color: rgba(53, 215, 161, 0.5); }
            .character.Electro { --element-color: rgba(204, 128, 255, 0.5); }
            .character.Dendro { --element-color: rgba(155, 229, 61, 0.5); }
            .character.Cryo { --element-color: rgba(123, 242, 242, 0.5); }
            .character.Geo { --element-color: rgba(255, 182, 30, 0.5); }
            .character.Other { --element-color: rgba(255, 255, 102, 0.5); }

        /* 手機：小於 1000px 時每行 5 個角色 */
        @media screen and (max-width: 1000px) {
            .character {
                flex: 0 0 calc(20% - 10px);
                max-width: calc(20% - 10px);
            }

            .element-filter {
                gap: 6px;
            }

                .character img,
                .character .placeholder {
                    width: 60px;
                    height: 60px;
                    font-size: 20px;
                }
        }

        /* ===== 按鈕 ===== */
        .btn {
            display: inline-block;
            background-color: #4CAF50;
            color: white;
            font-size: 16px;
            font-weight: bold;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            white-space: nowrap;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

            .btn:hover {
                transform: scale(1.05);
            }

            .btn:active {
                transform: scale(0.95);
            }

            .btn[hidden] {
                display: none;
            }

        #view-results-btn { background-color: #007BFF; }
        #view-results-btn:hover { background-color: #0056b3; }
        #clear-selection-btn { background-color: #FF4500; }
        #clear-selection-btn:hover { background-color: #e03c00; }
        #copy-url-btn { background-color: #FF8C00; }
        #copy-url-btn:hover { background-color: #E67E00; }

        #url-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
        }

        #generated-url {
            flex: 1;
            margin: 0;
            word-break: break-all;
            font-size: 14px;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 10px 0 70px;
        }

        #line-community-icon {
            position: fixed;
            bottom: 15px;
            left: 5px;
            z-index: 1000;
        }

            #line-community-icon img {
                width: 40px;
                height: 40px;
                border-radius: 15px;
                border: 3px solid #ffffff;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            }
    </style>
</head>
<body>
    <h1>
        選擇要尋找的角色
        <small>(建議登入𝕏帳號)</small>
    </h1>

    <div class="element-filter" id="element-filter" role="group" aria-label="依元素篩選"></div>

    <div class="character-list" id="character-list" role="group" aria-label="角色"></div>

    <div id="url-container" aria-live="polite">
        <p id="generated-url"></p>
        <button type="button" class="btn" id="copy-url-btn" hidden>複製</button>
    </div>
    <div class="actions">
        <a class="btn" id="view-results-btn" href="#" target="_blank" rel="noopener" hidden>前往𝕏頁面</a>
        <button type="button" class="btn" id="clear-selection-btn">清空選取</button>
    </div>

    <div id="line-community-icon">
        <a href="https://line.me/ti/g2/ws_23JibNNAGaEja-adxJv8q8f-oHEX7Jxl77w?utm_source=invitation&utm_medium=link_copy&utm_campaign=default" target="_blank" rel="noopener">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRdBmNgZmnl4lPSOnIgbzy4uJXnL_Okl_WDSAtHvbb1d3t58ZZbICa9IMWBuB8as4jIkM4&usqp=CAU"
                 alt="加入 LINE 社群">
        </a>
    </div>

    <script src="characters.js"></script>
    <!-- 本地圖片清單，由 scripts/download-icons.mjs 產生 -->
    <script src="img/manifest.js"></script>
    <script>
        var STORAGE_KEY = 'genshin-search-state';
        var LOCAL_ICONS = window.LOCAL_ICONS || {};
        var charactersById = {};
        CHARACTERS.forEach(function (c) { charactersById[c.id] = c; });

        var selectedRoles = [];
        var activeElement = null;

        // 優先用本地圖片，失敗時改用原網址，再失敗就顯示名稱首字
        function createIcon(localKey, remoteUrl, alt, fallbackText) {
            var img = document.createElement('img');
            var sources = [LOCAL_ICONS[localKey], remoteUrl].filter(Boolean);
            img.alt = alt;
            img.loading = 'lazy';
            img.decoding = 'async';
            img.onerror = function () {
                sources.shift();
                if (sources.length > 0) {
                    img.src = sources[0];
                } else if (fallbackText) {
                    var box = document.createElement('span');
                    box.className = 'placeholder';
                    box.setAttribute('aria-hidden', 'true');
                    box.textContent = fallbackText;
                    img.replaceWith(box);
                }
            };
            if (sources.length > 0) img.src = sources[0];
            else setTimeout(img.onerror);
            return img;
        }

        function renderElements() {
            var container = document.getElementById('element-filter');
            ELEMENTS.forEach(function (el) {
                var btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'element-icon';
                btn.dataset.element = el.id;
                btn.title = el.name;
                btn.setAttribute('aria-label', el.name);
                btn.setAttribute('aria-pressed', 'false');
                btn.appendChild(createIcon('element:' + el.id, el.img, ''));
                btn.addEventListener('click', function () { filterByTag(el.id); });
                container.appendChild(btn);
            });
        }

        function renderCharacters() {
            var container = document.getElementById('character-list');
            CHARACTERS.forEach(function (c) {
                var btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'character ' + c.element;
                btn.dataset.id = c.id;
                btn.setAttribute('aria-pressed', 'false');
                btn.appendChild(createIcon(c.id, c.img, '', c.name.charAt(0)));
                var label = document.createElement('span');
                label.textContent = c.name;
                btn.appendChild(label);
                btn.addEventListener('click', function () { toggleSelection(c.id); });
                container.appendChild(btn);
            });
        }

        function toggleSelection(id) {
            if (selectedRoles.indexOf(id) >= 0) {
                selectedRoles = selectedRoles.filter(function (item) { return item !== id; });
            } else {
                selectedRoles.push(id);
            }
            update();
        }

        // 點元素只顯示該元素的角色，再點一次同一個元素則顯示全部
        function filterByTag(element) {
            activeElement = activeElement === element ? null : element;
            update();
        }

        function clearSelection() {
            selectedRoles = [];
            update();
        }

        // 每個角色的多個 hashtag 用 OR 組成一組，不同角色之間維持原本的「同時包含」
        function buildQuery(ids) {
            return ids.map(function (id) {
                var tags = charactersById[id].tags.map(function (t) { return '#' + t; });
                return tags.length > 1 ? '(' + tags.join(' OR ') + ')' : tags[0];
            }).join(' ');
        }

        function update() {
            document.querySelectorAll('.character').forEach(function (btn) {
                var id = btn.dataset.id;
                btn.setAttribute('aria-pressed', String(selectedRoles.indexOf(id) >= 0));
                btn.hidden = activeElement !== null && charactersById[id].element !== activeElement;
            });
            document.querySelectorAll('.element-icon').forEach(function (btn) {
                btn.setAttribute('aria-pressed', String(btn.dataset.element === activeElement));
            });

            var urlElement = document.getElementById('generated-url');
            var resultsLink = document.getElementById('view-results-btn');
            var copyButton = document.getElementById('copy-url-btn');
            if (selectedRoles.length > 0) {
                var url = 'https://x.com/search?q=' + encodeURIComponent(buildQuery(selectedRoles));
                urlElement.textContent = url;
                resultsLink.href = url;
            } else {
                urlElement.textContent = '';
            }
            resultsLink.hidden = copyButton.hidden = selectedRoles.length === 0;

            saveState();
        }

        // ===== 選取狀態：存在網址 (#c=Klee,Nahida&e=Pyro) 與 localStorage =====
        function saveState() {
            // id 都是英數字，不需編碼，逗號保留原樣比較好讀
            var parts = [];
            if (selectedRoles.length > 0) parts.push('c=' + selectedRoles.join(','));
            if (activeElement) parts.push('e=' + activeElement);
            var hash = parts.join('&');
            history.replaceState(null, '', hash ? '#' + hash : location.pathname + location.search);
            try {
                localStorage.setItem(STORAGE_KEY, hash);
            } catch (e) { /* 無痕模式等情況下 localStorage 可能不能用 */ }
        }

        function loadState() {
            var hash = location.hash.slice(1);
            if (!hash) {
                try {
                    hash = localStorage.getItem(STORAGE_KEY) || '';
                } catch (e) { /* 同上 */ }
            }
            var params = new URLSearchParams(hash);
            selectedRoles = (params.get('c') || '').split(',').filter(function (id, i, arr) {
                return charactersById[id] && arr.indexOf(id) === i;
            });
            var element = params.get('e');
            activeElement = ELEMENTS.some(function (el) { return el.id === element; }) ? element : null;
        }

        function copyToClipboard() {
            var url = document.getElementById('generated-url').textContent;
            var button = document.getElementById('copy-url-btn');
            navigator.clipboard.writeText(url).then(function () {
                button.textContent = '已複製';
                button.style.fontSize = '14px';
                setTimeout(function () {
                    button.textContent = '複製';
                    button.style.fontSize = '';
                }, 2000);
            });
        }

        renderElements();
        renderCharacters();
        document.getElementById('copy-url-btn').addEventListener('click', copyToClipboard);
        document.getElementById('clear-selection-btn').addEventListener('click', clearSelection);
        window.addEventListener('hashchange', function () {
            loadState();
            update();
        });
        loadState();
        update();
    </script>
</body>
</html>
